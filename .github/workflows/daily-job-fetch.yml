name: Daily job fetch + tailor

on:
  schedule:
    # 13:00 UTC daily — adjust to whenever you want fresh postings ready.
    - cron: "0 13 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

jobs:
  fetch-and-tailor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch new postings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ADZUNA_COUNTRY: ${{ vars.ADZUNA_COUNTRY }}
          JOB_KEYWORDS: ${{ vars.JOB_KEYWORDS }}
        run: python -m fetcher.fetch_jobs

      - name: Tailor resumes for new matches
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m tailor.tailor
